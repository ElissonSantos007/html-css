<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            height: 200px;
            vertical-align: middle;
        }

        thead, .medias {
            background-color: gray;
            color: white;
        }

        .medias {
            text-align: left;
        }

        th, td { 
            border: 1px solid black;
            padding: 5px;
        }

        .materia {
            text-align: left;
            font-weight: normal;
        }
        
    </style>
</head>
<body>
    <table>

        <thead>

            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
          </tr>

          <tr>
            <th scope="col">Nota 1</th>
            <th scope="col">Nota 2</th>
          </tr>

        </thead>

        <tbody>

            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <th class="materia">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th class="materia">Física</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th class="materia">Química</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th class="materia">Biologia</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th colspan="4" class="medias">Média de Exatas</th>
                <td class="medias">0.0</td>
            </tr>

            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <th class="materia">História</th>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <th class="materia">Geografia</th>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>

        </tbody>

        <tfoot>

            <tr>
                <th colspan="4" class="medias">Média de Humanas</th>
                <td class="medias">0.0</td>
            </tr>

        </tfoot>

    </table>
</body>
</html>
